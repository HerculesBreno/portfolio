<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7ce">
<title>O Cinturão de Ouro</title>
<style>
:root{color-scheme:light;--paper:#f7e7ce;--ink:#332c28}
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,'Times New Roman',serif;overflow:hidden}
button{font:inherit;color:inherit}
#book{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior-y:contain;touch-action:pan-y pinch-zoom;outline:none}
#book::-webkit-scrollbar{display:none}
.page{height:100vh;height:100dvh;position:relative;scroll-snap-align:start;scroll-snap-stop:always;isolation:isolate;overflow:hidden;background:var(--paper)}
.folio{position:relative;width:min(100%,56.25dvh);height:100%;margin:auto;background-image:url('imagens/textura.png');background-size:cover}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block}
.words{position:absolute;left:8%;width:84%;top:19%;margin:0;text-align:center;text-wrap:balance;font-size:clamp(25px,7vw,38px);font-weight:400;line-height:1.26;letter-spacing:-.025em;z-index:2;opacity:0;transform:translateY(6px)}
.settled .scene{animation:arrive 1s cubic-bezier(.25,.1,.25,1) both}
.settled .words{animation:words 1s var(--text-delay,2080ms) cubic-bezier(.25,.1,.25,1) both}
@keyframes arrive{from{opacity:.55}to{opacity:1}}
@keyframes words{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.navigation{position:fixed;inset:auto 0 max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;align-items:center;pointer-events:none;z-index:5;transition:opacity .2s}
.navigation button,.counter{pointer-events:auto;background:rgba(255,249,237,.92);border:1px solid #ac96794d;border-radius:99px;box-shadow:0 1px 6px #332c2810}
.navigation button{width:44px;height:44px;cursor:pointer;font-family:Arial,sans-serif;font-size:22px}
.navigation button:disabled{opacity:.35;cursor:default}
.counter{font-size:12px;letter-spacing:.09em;padding:9px 12px;font-variant-numeric:tabular-nums}
.navigation.hidden{opacity:0;pointer-events:none}.navigation.hidden>*{pointer-events:none}
button:focus-visible,#book:focus-visible{outline:2px solid #79592f;outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(orientation:landscape) and (max-height:550px){.words{font-size:clamp(16px,4.4dvh,24px)}.navigation{justify-content:flex-end;padding-right:18px}}
@media(prefers-reduced-motion:reduce){.words{opacity:1!important;transform:none!important}*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{body,#book{height:auto;overflow:visible}.page{height:100vh;break-after:page}.navigation{display:none}.scene,.words{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<main id="book" tabindex="0" aria-label="O Cinturão de Ouro — 30 cenas ilustradas"></main>
<nav class="navigation" aria-label="Navegação do livro"><button id="previous" aria-label="Cena anterior">‹</button><span class="counter" id="counter">01 / 30</span><button id="next" aria-label="Próxima cena">›</button></nav>
<div class="sr" aria-live="polite" id="reading"></div>
<noscript>Ative o JavaScript para ler este livro. As 30 cenas também estão disponíveis como imagens PNG no pacote de imagens.</noscript>
<script type="application/json" id="story">[{"n": 3, "title": "A Porta do Tatame", "text": "", "alt": "Ponto de vista de Lia, na altura da criança. Só sua mão no batente e uma pontinha do quimono rosa aparecem no primeiro plano. À frente, o tatame parece enorme. Meninos e meninas diversos treinam, com quimonos azul, preto, branco e rosa. Movimentos reais, sem combates espetaculares. Lia ainda está do lado de fora.", "uri": "imagens/cena-01.png", "w": 540, "h": 960, "artTop": 602}, {"n": 4, "title": "A Porta do Tatame", "text": "— Oi!", "alt": "A mestra se aproxima e aparece à direita, vista de baixo, do tronco para cima. Olha para Lia, com expressão acolhedora. O espaço continua grande, mas a presença da mestra aproxima o leitor.", "uri": "imagens/cena-02.png", "w": 540, "h": 960, "artTop": 602}, {"n": 5, "title": "A Porta do Tatame", "text": "— Vamos entrar juntas?", "alt": "A mestra se abaixa até a altura de Lia e oferece a mão aberta. A menina negra, de cabelos bem cacheados e quimono rosa, aparece com mais clareza. Ela olha para a mão, ainda hesitante. Sem puxá-la ou apressá-la.", "uri": "imagens/cena-03.png", "w": 540, "h": 960, "artTop": 602}, {"n": 6, "title": "A Porta do Tatame", "text": "", "alt": "Apenas os pés descalços das duas, lado a lado, na borda do tatame, entrando juntas. As sombras mostram o gesto de reverência. A postura dos pés de Lia deixa de parecer tão contraída. Não mostrar rostos nem acrescentar explicação.", "uri": "imagens/cena-04.png", "w": 540, "h": 960, "artTop": 602}, {"n": 7, "title": "O Uniforme", "text": "— Não sei fazer…", "alt": "Lia já está de quimono rosa, como na chegada. Observa o tecido grosso e tenta juntar as pontas da faixa branca, que se soltou. Os colegas, com quimonos de cores diferentes, também ajeitam suas roupas. Ela pertence à mesma atividade sem deixar de ser quem é.", "uri": "imagens/cena-05.png", "w": 540, "h": 960, "artTop": 602}, {"n": 8, "title": "O Uniforme", "text": "— Eu te ajudo.", "alt": "A mestra se abaixa. Em destaque, as mãos das duas fazem o nó da faixa branca: Lia segura uma ponta e participa. No fundo, a turma se prepara para aprender. A faixa fica ajustada, e Lia olha para os colegas. Preservar as cores e os traços da personagem.", "uri": "imagens/cena-06.png", "w": 540, "h": 960, "artTop": 602}, {"n": 9, "title": "Animais do Tatame", "text": "— Vamos brincar de bicho?", "alt": "A mestra demonstra, e a turma a acompanha em pequenos momentos de uma mesma brincadeira: o gato e o urso. Lia começa observando, depois experimenta. As posturas humanas devem ser reconhecíveis; animais podem aparecer apenas como pequenas associações imaginadas, sem transformar a cena em fantasia literal.", "uri": "imagens/cena-07.png", "w": 540, "h": 960, "artTop": 360}, {"n": 10, "title": "Animais do Tatame", "text": "", "alt": "Lia abre os braços e tenta se equilibrar como uma águia. Balança, ajusta o pé e sorri. Outras crianças também tentam, cada uma do seu jeito; ninguém ri da dificuldade alheia. A imagem conta a descoberta do corpo pelo brincar.", "uri": "imagens/cena-08.png", "w": 540, "h": 960, "artTop": 360}, {"n": 11, "title": "O Primeiro Fracasso", "text": "", "alt": "Em outra aula, a mestra demonstra uma técnica simples com um parceiro. Lia tenta repeti-la em uma pequena sequência visual: observa, posiciona os pés, perde o equilíbrio. A mestra acompanha a turma. A técnica ainda não sai; não apresentar um acerto imediato.", "uri": "imagens/cena-09.png", "w": 540, "h": 960, "artTop": 360}, {"n": 12, "title": "O Primeiro Fracasso", "text": "— Não consigo.", "alt": "Lia está sentada no tatame, ombros curvados, mãos apertando o tecido do quimono e olhos úmidos. Olha na direção da saída, com vontade de parar. Os outros continuam ao fundo, sem zombaria. A mestra permanece próxima e atenta. Deixar silêncio e espaço na composição.", "uri": "imagens/cena-10.png", "w": 540, "h": 960, "artTop": 602}, {"n": 13, "title": "A Paciência do Colega", "text": "— No começo, eu também não conseguia.", "alt": "Um colega mais velho, com cerca de dez a doze anos, senta-se ao lado de Lia, na mesma direção que ela. Compartilha a dificuldade sem apontar o dedo ou exigir que volte ao treino. Lia levanta um pouco o rosto. Sua respiração e suas mãos começam a relaxar.", "uri": "imagens/cena-11.png", "w": 540, "h": 960, "artTop": 360}, {"n": 14, "title": "A Paciência do Colega", "text": "", "alt": "O mesmo colega demonstra devagar o movimento que a frustrou. Lia observa seus pés, tenta, para e ajusta a posição. Ele espera. Uma pequena sequência mostra avanço parcial, ainda imperfeito, sem transformação instantânea. A mestra supervisiona ao fundo.", "uri": "imagens/cena-12.png", "w": 540, "h": 960, "artTop": 360}, {"n": 15, "title": "A Arte de Cair", "text": "— Até você cai?", "alt": "Em outra aula, a mestra demonstra uma queda controlada e a continuação do movimento no chão. Lia observa surpresa. Mostrar a mestra próxima do solo, com postura correta e cabeça protegida. A imagem deve ser orientada por referência real de jiu-jítsu infantil.", "uri": "imagens/cena-13.png", "w": 540, "h": 960, "artTop": 360}, {"n": 16, "title": "A Arte de Cair", "text": "— Eu também aprendi.", "alt": "A mestra acompanha Lia praticando de forma controlada sobre o tatame. Em poucos momentos visuais, a menina aprende a chegar ao chão com cuidado e continua o movimento. A confiança cresce aos poucos. A mestra segue acessível, demonstrando novamente quando necessário.", "uri": "imagens/cena-14.png", "w": 540, "h": 960, "artTop": 360}, {"n": 17, "title": "O Primeiro Combate", "text": "— Cumprimentem-se e comecem.", "alt": "Primeiro treino de combate, na academia, sob supervisão da mestra. Lia e um colega menor se cumprimentam; ambos parecem atentos e um pouco nervosos. Não é torneio: sem pódio, medalhas ou torcida. Diferenciar visualmente este parceiro do colega mais velho que a ajudou.", "uri": "imagens/cena-15.png", "w": 540, "h": 960, "artTop": 360}, {"n": 18, "title": "O Primeiro Combate", "text": "— Como você fez isso?", "alt": "Lia avança rígida, tentando usar só a força. O colega acompanha e redireciona seu impulso, desequilibrando-a com técnica. Em sequência curta, o movimento continua no chão. Lia reage com curiosidade, observando o parceiro, sem humilhação nem pose de vencedor.", "uri": "imagens/cena-16.png", "w": 540, "h": 960, "artTop": 360}, {"n": 19, "title": "Força e Inteligência", "text": "— Vamos olhar de novo?", "alt": "A mestra se senta perto de Lia e retoma o que ocorreu com uma demonstração lenta. Mostra o instante em que o peso saiu da base e como o parceiro acompanhou o movimento. Lia observa pés, mãos e quadril. A explicação acontece pelos gestos, sem um bloco de teoria.", "uri": "imagens/cena-17.png", "w": 540, "h": 960, "artTop": 602}, {"n": 20, "title": "Força e Inteligência", "text": "", "alt": "Ao longo de outros treinos, Lia observa, testa um ajuste e pede que o colega repita pelo gesto. Agora usa o corpo com mais atenção, combinando esforço, equilíbrio e direção. Pequenas mudanças na luz exterior e no desgaste do quimono indicam passagem de semanas. Não transformar entendimento em vitória automática.", "uri": "imagens/cena-18.png", "w": 540, "h": 960, "artTop": 360}, {"n": 21, "title": "Respeito Mútuo", "text": "", "alt": "Semanas depois, Lia volta a treinar com o mesmo colega do primeiro combate. Ambos alternam posições: ela consegue sair de uma dificuldade, ele encontra outra resposta. Há quedas, defesa e movimento no chão dos dois lados. O treino mostra progresso e esforço compartilhado, sem definir um campeão.", "uri": "imagens/cena-19.png", "w": 540, "h": 960, "artTop": 360}, {"n": 22, "title": "Respeito Mútuo", "text": "— Obrigada pelo treino.", "alt": "A mestra encerra. Lia, cansada e satisfeita, estende a mão. O colega aceita, também ofegante. Dar destaque ao aperto de mãos e ao olhar recíproco. A conquista desta página é o respeito, sem troféu ou placar.", "uri": "imagens/cena-20.png", "w": 540, "h": 960, "artTop": 602}, {"n": 23, "title": "O Cinturão Colorido", "text": "", "alt": "Meses depois da chegada, em uma graduação na academia, a mestra chama Lia diante da turma e amarra sua primeira faixa colorida. A turma acompanha com carinho. Manter o quimono rosa, agora amaciado pelo uso. Usar faixa infantil compatível com a graduação definida pela autora; o manuscrito não fixa uma cor exata. Não usar faixa dourada literal.", "uri": "imagens/cena-21.png", "w": 540, "h": 960, "artTop": 360}, {"n": 24, "title": "O Cinturão Colorido", "text": "— Cada faixa é mais um começo.", "alt": "Lia toca a nova faixa e olha para a turma. Os colegas celebram sua dedicação; entre eles, crianças iniciantes de faixa branca observam. A mestra mostra discretamente que há outras etapas pela frente. A composição liga o reconhecimento ao caminho e às pessoas, sem superioridade.", "uri": "imagens/cena-22.png", "w": 540, "h": 960, "artTop": 602}, {"n": 25, "title": "Lições Fora do Tatame", "text": "Vou tentar de outro jeito.", "alt": "Na escola, sem quimono, Lia encontra dificuldade em uma atividade de matemática. Em dois pequenos momentos da mesma cena, ela respira, observa novamente e muda sua tentativa. Conservar um vestígio do erro no caderno. A expressão e o gesto repetem a paciência aprendida no treino.", "uri": "imagens/cena-23.png", "w": 540, "h": 960, "artTop": 602}, {"n": 26, "title": "Lições Fora do Tatame", "text": "— Me mostra?", "alt": "Em uma atividade escolar compartilhada, Lia escuta a ideia de uma colega e aceita sua ajuda. As duas olham para o mesmo trabalho; Lia dá espaço à outra e participa. A imagem reúne respeito e humildade, sem transportar golpes para o recreio ou sugerir que ela deixou de ter dificuldades.", "uri": "imagens/cena-24.png", "w": 540, "h": 960, "artTop": 602}, {"n": 27, "title": "O Ciclo se Completa", "text": "", "alt": "De volta à academia, um menino novo hesita na entrada, com quimono ainda rígido, faixa branca e olhar baixo. Repetir o enquadramento e o espaço da chegada de Lia. Agora Lia, com sua faixa colorida, aparece do lado de dentro e o percebe.", "uri": "imagens/cena-25.png", "w": 540, "h": 960, "artTop": 360}, {"n": 28, "title": "O Ciclo se Completa", "text": "", "alt": "Lia reconhece a postura encolhida do menino. Olha para a mestra; ela responde com um pequeno gesto de incentivo. Lia se aproxima sem invadir seu espaço. A mestra permanece presente, e o colega mais velho que acolheu Lia pode aparecer ao fundo, ligando os gestos de cuidado.", "uri": "imagens/cena-26.png", "w": 540, "h": 960, "artTop": 360}, {"n": 29, "title": "O Ciclo se Completa", "text": "— Oi!", "alt": "Lia para diante do menino e o cumprimenta. Repetir a proximidade e o acolhimento da página 4, agora com outra criança oferecendo a saudação. O menino levanta os olhos. Lia permanece na sua altura, sem assumir postura de autoridade adulta.", "uri": "imagens/cena-27.png", "w": 540, "h": 960, "artTop": 360}, {"n": 30, "title": "O Ciclo se Completa", "text": "— Vamos entrar juntos?", "alt": "Lia oferece a mão aberta, como a mestra fez no início. O menino estende a sua. A faixa colorida de Lia aparece naturalmente, sem dominar a cena. O convite nasce do reconhecimento da dificuldade do outro.", "uri": "imagens/cena-28.png", "w": 540, "h": 960, "artTop": 360}, {"n": 31, "title": "O Ciclo se Completa", "text": "", "alt": "Já sobre o tatame, Lia demonstra devagar um movimento de urso do aquecimento. O menino tenta acompanhá-la. Ela para, observa e ajusta a própria demonstração para ajudá-lo a entender. A mestra supervisiona. A imagem mostra que Lia também aprende ao compartilhar.", "uri": "imagens/cena-29.png", "w": 540, "h": 960, "artTop": 360}, {"n": 32, "title": "O Ciclo se Completa", "text": "", "alt": "O menino consegue sustentar o movimento por um instante e sorri. Lia sorri de volta, ao lado dele, enquanto a turma segue aprendendo. A mestra observa com carinho. Encerrar na escala das crianças e no espaço compartilhado, sem frase moralizante, brilho mágico ou prêmio: o acolhimento recebido continua em outro aprendiz.", "uri": "imagens/cena-30.png", "w": 540, "h": 960, "artTop": 360}]</script>
<script>
'use strict';
const story=JSON.parse(document.getElementById('story').textContent),book=document.getElementById('book');
const preference=matchMedia('(prefers-reduced-motion: reduce)');
let current=0,frame=0,hideTimer=0,settleTimer=0;const pages=[];const textDelays={"3": 2440, "4": 2440, "5": 2260, "6": 2260, "7": 2440, "8": 2080, "9": 2260, "10": 2440, "11": 2440, "12": 2440, "13": 2260, "14": 2440, "15": 2440, "16": 2440, "17": 2440, "18": 2440, "19": 2440, "20": 2440, "21": 2440, "22": 2440, "23": 2440, "24": 2440, "25": 2440, "26": 2440, "27": 2440, "28": 2440, "29": 2260, "30": 2440, "31": 2260, "32": 2440};
for(const [i,d] of story.entries()){
 const section=document.createElement('section');section.className='page';section.dataset.scene=i+1;section.style.setProperty('--text-delay',`${textDelays[d.n]||2080}ms`);
 section.setAttribute('aria-label',`Cena ${i+1} de ${story.length} — ${d.title}`);
 const folio=document.createElement('div');folio.className='folio';
 const img=document.createElement('img');img.className='scene';img.src=d.uri;img.alt=d.alt;img.width=540;img.height=960;img.decoding='async';img.loading=i<2?'eager':'lazy';
 folio.append(img);
 if(d.text){const words=document.createElement('p');words.className='words';words.textContent=d.text;folio.append(words)}
 section.append(folio);book.append(section);pages.push(section);
}
function show(index){
 current=Math.max(0,Math.min(story.length-1,index));
 pages.forEach((p,i)=>{p.classList.toggle('current',i===current);if(i!==current)p.classList.remove('settled')});
 document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${story.length}`;
 document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===story.length-1;
 document.getElementById('reading').textContent=`Cena ${current+1}. ${story[current].text||story[current].title}`;
 for(let i=Math.max(0,current-1);i<=Math.min(story.length-1,current+1);i++)pages[i].querySelector('img').loading='eager';
}
function go(index,instant=false){index=Math.max(0,Math.min(story.length-1,index));book.scrollTo({top:pages[index].offsetTop,behavior:instant||preference.matches?'instant':'smooth'});}
book.addEventListener('scroll',()=>{pages[current].classList.remove('settled');clearTimeout(settleTimer);settleTimer=setTimeout(()=>pages[current].classList.add('settled'),140);if(frame)return;frame=requestAnimationFrame(()=>{frame=0;const i=Math.round(book.scrollTop/book.clientHeight);if(i!==current)show(i)})},{passive:true});
document.getElementById('previous').addEventListener('click',()=>go(current-1));document.getElementById('next').addEventListener('click',()=>go(current+1));
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 let target;
 if(['ArrowDown','ArrowRight','PageDown'].includes(e.key)||(e.key===' '&&e.target.tagName!=='BUTTON'))target=current+1;
 if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))target=current-1;
 if(e.key==='Home')target=0;if(e.key==='End')target=story.length-1;
 if(target!==undefined){e.preventDefault();go(target,e.key==='Home'||e.key==='End');wake()}
});
const nav=document.querySelector('.navigation');
function wake(){nav.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!nav.contains(document.activeElement))nav.classList.add('hidden')},2600)}
document.addEventListener('pointerdown',wake,{passive:true});document.addEventListener('pointermove',wake,{passive:true});nav.addEventListener('focusin',wake);
let lastHeight=book.clientHeight;
new ResizeObserver(()=>{if(book.clientHeight!==lastHeight){lastHeight=book.clientHeight;go(current,true)}}).observe(book);
show(0);pages[0].classList.add('settled');wake();
</script>
</body>
</html>
