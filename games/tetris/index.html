    <style>
      /* Keep the next-piece preview away from the stack on narrow screens. */
      @media (max-width: 719px) {
        .hud-col--right .next-box {
          position: fixed;
          top: max(12px, env(safe-area-inset-top));
          right: 66px;
          z-index: 6;
          width: auto;
          margin: 0;
          padding: 0;
          border: 0;
          display: flex;
          flex-direction: row;
          align-items: center;
          gap: 6px;
        }

          border: 1px solid rgba(232, 211, 164, 0.35);
